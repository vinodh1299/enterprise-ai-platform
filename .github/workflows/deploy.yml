name: Enterprise AI CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ==========================================
  # Job 1: Automated Integration Test Suite
  # ==========================================
  test:
    name: Run Pytest Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ai_enterprise
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Execute Pytest Suite (All 16 Tests)
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ai_enterprise
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci_test_jwt_secret_key_12345
        run: |
          PYTHONPATH=backend pytest backend/tests/

  # ==========================================
  # Job 2: Build & Push Production Docker Image
  # ==========================================
  build-and-push:
    name: Build & Push Docker Container Image
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub Container Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ai-enterprise-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/ai-enterprise-backend:${{ github.sha }}

  # ==========================================
  # Job 3: Automated Cloud Container Deployment
  # ==========================================
  deploy:
    name: Deploy Container to Enterprise Cloud
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy Container Service
        run: |
          echo "Triggering Single-Tenant Dedicated Instance Deployment via Webhook..."
          # Webhook or AWS/GCP CLI deployment trigger goes here
